# FreeShift：宿主机 Nginx 监听 8080，托管静态资源并反代 API
# 放置：/etc/nginx/conf.d/freeshift.conf
# 校验：sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8080;
    server_name _;

    root /opt/freeshift/apps/web/dist;
    index index.html;

    client_max_body_size 10m;
    server_tokens off;

    # 访问控制：先启用 Basic Auth（认证文件见 docs/DEPLOY-NATIVE.md）
    auth_basic "FreeShift";
    auth_basic_user_file /etc/nginx/freeshift.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3100/healthz;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
