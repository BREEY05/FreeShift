# FreeShift 子域名 + HTTPS 配置模板
# 使用前替换：
#   __DOMAIN__  例如 freeshift.ainavi.online
#   __CERT__    证书 fullchain 路径（Let's Encrypt 或现有通配符证书）
#   __KEY__     证书私钥路径
# 放置：/etc/nginx/conf.d/freeshift.conf
# 注意：本文件替代原来的 8080 配置；启用后 8080 不再对外。

server {
    listen 80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 验证目录（已有证书时可保留，续期需要）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 确认 HTTPS 正常后再启用 HSTS（启用后请勿随意回退到 HTTP）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/freeshift/apps/web/dist;
    index index.html;

    client_max_body_size 10m;
    server_tokens off;

    auth_basic "FreeShift";
    auth_basic_user_file /etc/nginx/freeshift.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3100/healthz;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
